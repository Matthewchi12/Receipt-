<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Receipt Generator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      min-height: 100vh;
      padding: 25px 15px;
      color: #1e293b;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 25px;
    }

    @media (max-width: 980px) {
      .container { grid-template-columns: 1fr; }
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 22px; }

    .top-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .lang-btn, .type-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 2px solid #e2e8f0;
      background: #f8fafc;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active, .type-btn.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.87rem;
      margin-bottom: 6px;
      color: #475569;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 11px;
      font-size: 0.95rem;
      background: #f8fafc;
      transition: all 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4f46e5;
      background: white;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #475569;
    }

    /* ========== RECEIPT STYLING (MORE REALISTIC) ========== */
    .receipt-panel { display: none; }
    .receipt-panel.show { display: block; }

    .receipt {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border: 1px solid #e2e8f0;
      position: relative;
    }

    .receipt-header {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 28px 30px 24px;
      text-align: center;
      position: relative;
    }

    .receipt-header.delivery {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
    }

    .bank-name {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .receipt-title {
      font-size: 0.85rem;
      opacity: 0.9;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .receipt-body {
      padding: 30px;
      position: relative;
    }

    /* Success Badge */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #dcfce7;
      color: #166534;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 24px;
      border: 2px solid #86efac;
    }

    .status::before {
      content: '✓';
      background: #22c55e;
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
    }

    /* Amount Box */
    .amount-box {
      text-align: center;
      margin-bottom: 28px;
      padding: 22px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-radius: 16px;
      border: 2px dashed #4ade80;
      position: relative;
    }

    .amount-label {
      font-size: 0.8rem;
      color: #166534;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .amount-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #15803d;
    }

    /* Details */
    .details {
      display: grid;
      gap: 14px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px dashed #e2e8f0;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #64748b;
      font-size: 0.88rem;
      flex-shrink: 0;
    }

    .detail-value {
      font-weight: 600;
      color: #1e293b;
      text-align: right;
      word-break: break-word;
    }

    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #4f46e5;
      margin: 22px 0 12px;
      font-weight: 700;
      border-left: 4px solid #4f46e5;
      padding-left: 10px;
    }

    .receipt-footer {
      background: #f8fafc;
      padding: 18px 30px;
      text-align: center;
      font-size: 0.78rem;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }

    .txn-id {
      font-family: ui-monospace, monospace;
      background: #f1f5f9;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.86rem;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      padding: 0 5px;
    }

    .actions .btn { margin-top: 0; }

    @media print {
      body { background: white; padding: 0; }
      .form-card, .actions, .top-controls, h1, .subtitle { display: none !important; }
      .container { display: block; }
      .receipt { box-shadow: none; border: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- FORM -->
    <div class="card form-card">
      <h1 id="appTitle">Smart Receipt Generator</h1>
      <p class="subtitle" id="appSubtitle">Create professional Payment or Delivery receipts</p>

      <div class="top-controls">
        <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">English</button>
        <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">Español</button>
        <button class="lang-btn" data-lang="hu" onclick="setLanguage('hu')">Magyar</button>
      </div>

      <div class="top-controls" style="margin-top: -8px;">
        <button class="type-btn active" data-type="payment" onclick="setType('payment')" id="btnPayment">Payment Receipt</button>
        <button class="type-btn" data-type="delivery" onclick="setType('delivery')" id="btnDelivery">Delivery Receipt</button>
      </div>

      <!-- Currency -->
      <div class="form-group">
        <label id="lblCurrency">Currency</label>
        <select id="currency">
          <option value="USD">US Dollar ($)</option>
          <option value="GBP">British Pound (£)</option>
          <option value="EUR">Euro (€)</option>
          <option value="PYG">Guaraní (₲)</option>
        </select>
      </div>

      <!-- ========== PAYMENT FORM ========== -->
      <div id="paymentForm">
        <div class="form-group">
          <label id="lblBank">Bank Name</label>
          <input type="text" id="bank" value="Guarani Bank">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label id="lblSender">Sender Name</label>
            <input type="text" id="sender">
          </div>
          <div class="form-group">
            <label id="lblSenderCountry">Sender Country</label>
            <input type="text" id="senderCountry">
          </div>
        </div>

        <div class="form-group">
          <label id="lblSenderAccount">Sender Account Number</label>
          <input type="text" id="senderAccount" placeholder="e.g. 1234567890">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label id="lblReceiver">Receiver Name</label>
            <input type="text" id="receiver">
          </div>
          <div class="form-group">
            <label id="lblReceiverCountry">Receiver Country</label>
            <input type="text" id="receiverCountry">
          </div>
        </div>

        <div class="form-group">
          <label id="lblReceiverAccount">Receiver Account Number</label>
          <input type="text" id="receiverAccount" placeholder="e.g. 0987654321">
        </div>

        <div class="form-group">
          <label id="lblAmount">Amount</label>
          <input type="text" id="amount" placeholder="1500.00">
        </div>

        <div class="form-group">
          <label id="lblTime">Transaction Time</label>
          <input type="datetime-local" id="time">
        </div>

        <div class="form-group">
          <label id="lblNote">Reference / Note (optional)</label>
          <input type="text" id="note">
        </div>
      </div>

      <!-- ========== DELIVERY FORM ========== -->
      <div id="deliveryForm" style="display:none;">
        <div class="form-group">
          <label id="lblCourier">Courier / Company</label>
          <input type="text" id="courier" value="FastTrack Express">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label id="lblSenderName">Sender Name</label>
            <input type="text" id="dSender">
          </div>
          <div class="form-group">
            <label id="lblSenderCountryD">Sender Country</label>
            <input type="text" id="dSenderCountry">
          </div>
        </div>

        <div class="form-group">
          <label id="lblSenderPhone">Sender Phone</label>
          <input type="text" id="dSenderPhone">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label id="lblReceiverName">Receiver Name</label>
            <input type="text" id="dReceiver">
          </div>
          <div class="form-group">
            <label id="lblReceiverCountryD">Receiver Country</label>
            <input type="text" id="dReceiverCountry">
          </div>
        </div>

        <div class="form-group">
          <label id="lblReceiverPhone">Receiver Phone</label>
          <input type="text" id="dReceiverPhone">
        </div>

        <div class="form-group">
          <label id="lblPackage">Package Description</label>
          <input type="text" id="packageDesc">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label id="lblWeight">Weight (kg)</label>
            <input type="text" id="weight">
          </div>
          <div class="form-group">
            <label id="lblService">Service Type</label>
            <select id="serviceType">
              <option value="Standard">Standard</option>
              <option value="Express">Express</option>
              <option value="Overnight">Overnight</option>
              <option value="Economy">Economy</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label id="lblAmountPaid">Amount Paid</label>
          <input type="text" id="dAmount">
        </div>

        <div class="form-group">
          <label id="lblShipTime">Shipment Date & Time</label>
          <input type="datetime-local" id="dTime">
        </div>

        <div class="form-group">
          <label id="lblNotes">Special Instructions</label>
          <textarea id="dNotes"></textarea>
        </div>
      </div>

      <button class="btn" onclick="generateReceipt()" id="btnGenerate">Generate Receipt</button>
      <button class="btn btn-secondary" onclick="clearForm()" id="btnClear">Clear Form</button>
    </div>

    <!-- RECEIPT PREVIEW -->
    <div class="receipt-panel" id="receiptPanel">
      <div class="card" style="padding:0; overflow:hidden;">
        <div class="receipt" id="receipt"></div>
        <div class="actions" style="padding: 20px 28px 28px;">
          <button class="btn" onclick="window.print()">🖨️ Print / PDF</button>
          <button class="btn btn-secondary" onclick="document.getElementById('receiptPanel').classList.remove('show')">Close</button>
        </div>
      </div>
    </div>
  </div>

    let currentLang = 'en';
    let currentType = 'payment';

    const currencySymbols = {
      USD: '$',
      GBP: '£',
      EUR: '€',
      PYG: '₲'
    };

    window.onload = function() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      const iso = now.toISOString().slice(0, 16);
      document.getElementById('time').value = iso;
      document.getElementById('dTime').value = iso;
      setLanguage('en');
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-lang="${lang}"]`).classList.add('active');

      const t = i18n[lang];
      // Update all labels
      document.getElementById('appTitle').textContent = t.appTitle;
      document.getElementById('appSubtitle').textContent = t.appSubtitle;
      document.getElementById('btnPayment').textContent = t.btnPayment;
      document.getElementById('btnDelivery').textContent = t.btnDelivery;
      document.getElementById('btnGenerate').textContent = t.btnGenerate;
      document.getElementById('btnClear').textContent = t.btnClear;
      document.getElementById('lblCurrency').textContent = t.lblCurrency;

      document.getElementById('lblBank').textContent = t.lblBank;
      document.getElementById('lblSender').textContent = t.lblSender;
      document.getElementById('lblSenderCountry').textContent = t.lblSenderCountry;
      document.getElementById('lblSenderAccount').textContent = t.lblSenderAccount;
      document.getElementById('lblReceiver').textContent = t.lblReceiver;
      document.getElementById('lblReceiverCountry').textContent = t.lblReceiverCountry;

      document.getElementById('lblNotes').textContent = t.lblNotes;
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-type="${type}"]`).classList.add('active');
      document.getElementById('paymentForm').style.display = type === 'payment' ? 'block' : 'none';
      document.getElementById('deliveryForm').style.display = type === 'delivery' ? 'block' : 'none';
      document.getElementById('receiptPanel').classList.remove('show');
    }

    function formatMoney(val) {
      const num = Number(String(val).replace(/[^\d.]/g, '')) || 0;
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatDateTime(iso) {
      if (!iso) return '—';
      const dt = new Date(iso);
      return dt.toLocaleString(currentLang === 'hu' ? 'hu-HU' : currentLang === 'es' ? 'es-ES' : 'en-GB', {
        day: '2-digit', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit', hour12: true
      });
    }

    function generateId(prefix) {
      return prefix + '-' + Math.floor(10000000 + Math.random() * 90000000);
    }

    function getCurrencySymbol() {
      return currencySymbols[document.getElementById('currency').value] || '$';
    }

    function generateReceipt() {
      const t = i18n[currentLang];
      const symbol = getCurrencySymbol();
      const receiptEl = document.getElementById('receipt');

      if (currentType === 'payment') {
        const bank = document.getElementById('bank').value.trim() || 'Bank';
        const sender = document.getElementById('sender').value.trim() || '—';
        const senderCountry = document.getElementById('senderCountry').value.trim() || '—';
        const senderAccount = document.getElementById('senderAccount').value.trim() || '—';
        const receiver = document.getElementById('receiver').value.trim() || '—';
        const receiverCountry = document.getElementById('receiverCountry').value.trim() || '—';
        const receiverAccount = document.getElementById('receiverAccount').value.trim() || '—';
        const amount = formatMoney(document.getElementById('amount').value);
        const time = formatDateTime(document.getElementById('time').value);
        const note = document.getElementById('note').value.trim();
        const txn = generateId('TXN');

        receiptEl.innerHTML = `
          <div class="receipt-header">
            <div class="bank-name">${bank}</div>
            <div class="receipt-title">${t.paymentTitle}</div>
          </div>
          <div class="receipt-body">
            <div class="status">${t.statusPaid}</div>

            <div class="amount-box">
              <div class="amount-label">${t.amountPaid}</div>
              <div class="amount-value">${symbol}${amount}</div>
            </div>

            <div class="details">
              <div class="detail-row">
                <span class="detail-label">${t.txnId}</span>
                <span class="detail-value txn-id">${txn}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.dateTime}</span>
                <span class="detail-value">${time}</span>
              </div>
            </div>

            <div class="section-title">${t.senderInfo}</div>
            <div class="details">
              <div class="detail-row">
                <span class="detail-label">${t.from}</span>
                <span class="detail-value">${sender}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.country}</span>
                <span class="detail-value">${senderCountry}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.account}</span>
                <span class="detail-value">${senderAccount}</span>
              </div>
            </div>

            <div class="section-title">${t.receiverInfo}</div>
            <div class="details">
              <div class="detail-row">
                <span class="detail-label">${t.to}</span>
                <span class="detail-value">${receiver}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.country}</span>
                <span class="detail-value">${receiverCountry}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">${t.account}</span>
                <span class="detail-value">${receiverAccount}</span>
              </div>
            </div>

            ${note ? `
            <div class="details" style="margin-top:18px;">
              <div class="detail-row">
                <span class="detail-label">${t.reference}</span>
                <span class="detail-value">${note}</span>
              </div>
            </div>` : ''}
          </div>
          <div class="receipt-footer">${t.footer}</div>
        `;
      } else {
        // Delivery receipt remains the same
        const courier = document.getElementById('courier').value.trim() || 'Courier';
        const sName = document.getElementById('dSender').value.trim() || '—';
        const sCountry = document.getElementById('dSenderCountry').value.trim() || '—';
        const sPhone = document.getElementById('dSenderPhone').value.trim() || '—';
        const rName = document.getElementById('dReceiver').value.trim() || '—';
        const rCountry = document.getElementById('dReceiverCountry').value.trim() || '—';
        const rPhone = document.getElementById('dReceiverPhone').value.trim() || '—';
        const pkg = document.getElementById('packageDesc').value.trim() || '—';
        const weight = document.getElementById('weight').value.trim() || '—';
        const service = document.getElementById('serviceType').value;
        const amount = formatMoney(document.getElementById('dAmount').value);
        const time = formatDateTime(document.getElementById('dTime').value);
        const notes = document.getElementById('dNotes').value.trim();
        const tracking = generateId('TRK');

        receiptEl.innerHTML = `
          <div class="receipt-header delivery">
            <div class="bank-name">${courier}</div>
            <div class="receipt-title">${t.deliveryTitle}</div>
          </div>
          <div class="receipt-body">
            <div class="status">${t.statusShipped}</div>
            <div class="amount-box">
              <div class="amount-label">${t.amountPaid}</div>
              <div class="amount-value">${symbol}${amount}</div>
            </div>
            <div class="details">
              <div class="detail-row"><span class="detail-label">${t.trackingId}</span><span class="detail-value txn-id">${tracking}</span></div>
              <div class="detail-row"><span class="detail-label">${t.dateTime}</span><span class="detail-value">${time}</span></div>
              <div class="detail-row"><span class="detail-label">${t.service}</span><span class="detail-value">${service}</span></div>
            </div>
            <div class="section-title">${t.senderInfo}</div>
            <div class="details">
              <div class="detail-row"><span class="detail-label">${t.from}</span><span class="detail-value">${sName}</span></div>
              <div class="detail-row"><span class="detail-label">${t.country}</span><span class="detail-value">${sCountry}</span></div>
              <div class="detail-row"><span class="detail-label">${t.phone}</span><span class="detail-value">${sPhone}</span></div>
            </div>
            <div class="section-title">${t.receiverInfo}</div>
            <div class="details">
              <div class="detail-row"><span class="detail-label">${t.to}</span><span class="detail-value">${rName}</span></div>
              <div class="detail-row"><span class="detail-label">${t.country}</span><span class="detail-value">${rCountry}</span></div>
              <div class="detail-row"><span class="detail-label">${t.phone}</span><span class="detail-value">${rPhone}</span></div>
            </div>
            <div class="section-title">${t.packageInfo}</div>
            <div class="details">
              <div class="detail-row"><span class="detail-label">${t.description}</span><span class="detail-value">${pkg}</span></div>
              <div class="detail-row"><span class="detail-label">${t.weight}</span><span class="detail-value">${weight} kg</span></div>
              ${notes ? `<div class="detail-row"><span class="detail-label">${t.notes}</span><span class="detail-value">${notes}</span></div>` : ''}
            </div>
          </div>
          <div class="receipt-footer">${t.footer}</div>
        `;
      }

      document.getElementById('receiptPanel').classList.add('show');
      document.getElementById('receiptPanel').scrollIntoView({ behavior: 'smooth' });
    }

    function clearForm() {
      ['sender','senderCountry','senderAccount','receiver','receiverCountry','receiverAccount','amount','note',
       'dSender','dSenderCountry','dSenderPhone','dReceiver','dReceiverCountry','dReceiverPhone',
       'packageDesc','weight','dAmount','dNotes'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById('receiptPanel').classList.remove('show');
    }
  </script>
</body>
</html>
